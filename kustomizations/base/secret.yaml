---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  annotations:
    sealedsecrets.bitnami.com/namespace-wide: "true"
  name: common-secret
  namespace: siriusbot
spec:
  encryptedData:
    DATABASE_HOST: 
    DATABASE_NAME: 
    DATABASE_PASSWORD: 
    DATABASE_PORT: 
    DATABASE_URL: 
    DATABASE_USER: 
    DISCORD_BOT_TOKEN: 
    DISCORD_CLIENT_ID: 
    DISCORD_CLIENT_SECRET: 
  template:
    metadata:
      annotations:
        sealedsecrets.bitnami.com/namespace-wide: "true"
      name: common-secret
      namespace: siriusbot
    type: Opaque
---
apiVersion: bitnami.com/v1alpha1
